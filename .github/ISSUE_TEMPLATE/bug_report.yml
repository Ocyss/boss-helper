name: 问题反馈
description: 反馈使用中遇到的问题，帮助我们定位和修复。
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先搜索已有 Issue，避免重复提交。
        请勿上传账号、Cookie、Token、简历、聊天记录等敏感信息；截图和日志请先脱敏。
  - type: input
    id: extension-version
    attributes:
      label: 扩展版本
      description: 可在浏览器的扩展管理页面查看 Boss Helper 的版本号。
      placeholder: 例如：1.2.3
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: 浏览器名称及版本
      description: 请在浏览器的“关于”页面查看完整版本号。
      placeholder: 例如：Chrome 130.0.6723.92 / Edge 130.0.2849.80
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请描述遇到的问题、实际表现和你期望的正常行为。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请提供可重复操作的步骤，并说明问题是否每次都会出现。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏
      description: 可将截图或录屏拖入此处，或粘贴上传，提交前请遮盖个人信息。
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 请粘贴与问题相关的控制台错误或扩展日志；如无法获取，可说明原因。请先移除敏感信息。
      render: text
